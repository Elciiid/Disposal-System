version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=disposal_db
      - DB_USER=admin
      - DB_PASSWORD=admin_password
      - DB_SSLMODE=disable
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=disposal_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/var/lib/postgresql/data
      - ./db_scripts/neon_postgresql_schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
